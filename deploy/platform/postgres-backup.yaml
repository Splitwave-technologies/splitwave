apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: platform-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: platform-system
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: postgres-credentials
              command:
                - sh
                - -c
                - |
                  set -eu
                  FILE=/backups/platform-$(date +%Y%m%d-%H%M%S).sql.gz
                  # сеть пода (NetworkPolicy) применяется не мгновенно: ждём БД, а не падаем с «Connection refused»
                  n=0; until pg_isready -q -h postgres; do n=$((n+1)); [ "$n" -gt 60 ] && echo "database is not reachable" && exit 1; sleep 2; done
                  # дамп во временный файл, чтобы ошибка pg_dump не терялась в конвейере и не оставляла пустой «бэкап»
                  pg_dump -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB" > "$FILE.tmp"
                  gzip -c "$FILE.tmp" > "$FILE" && rm -f "$FILE.tmp"
                  [ -s "$FILE" ] || { echo "empty backup"; exit 1; }
                  echo "Backup written: $FILE ($(wc -c < "$FILE") bytes)"
                  find /backups -name '*.sql.gz' -mtime +14 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
