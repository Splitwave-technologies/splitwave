apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: control-plane
  sessionAffinity: None
  type: ClusterIP
