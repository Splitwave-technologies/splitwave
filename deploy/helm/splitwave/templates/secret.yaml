{{- if and .Values.postgresql.enabled .Values.secrets.existingSecret }}{{ fail "existingSecret работает только с внешней БД (postgresql.enabled=false)" }}{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "dsp.secretName" . }}
{{- if not .Values.postgresql.enabled }}
{{- $_ := required "postgresql.external.url обязателен при postgresql.enabled=false" .Values.postgresql.external.url }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "dsp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ADMIN_BOOTSTRAP_TOKEN: {{ include "dsp.stable" (list . $name "ADMIN_BOOTSTRAP_TOKEN" .Values.secrets.adminBootstrapToken (printf "boot_%s" (randAlphaNum 40))) | quote }}
  SECRET_ENCRYPTION_KEY: {{ include "dsp.stable" (list . $name "SECRET_ENCRYPTION_KEY" .Values.secrets.secretEncryptionKey (randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_")) | quote }}
  GITHUB_WEBHOOK_SECRET: {{ include "dsp.stable" (list . $name "GITHUB_WEBHOOK_SECRET" .Values.secrets.githubWebhookSecret (randAlphaNum 40)) | quote }}
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ .Values.postgresql.external.url | quote }}
  {{- end }}
  LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  {{- with .Values.secrets.scmGithubToken }}
  SCM_GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.scmGitlabToken }}
  SCM_GITLAB_TOKEN: {{ . | quote }}
  {{- end }}
  {{- if .Values.sso.clientSecret }}
  SSO_CLIENT_SECRET: {{ .Values.sso.clientSecret | quote }}
  {{- end }}
{{- end }}
