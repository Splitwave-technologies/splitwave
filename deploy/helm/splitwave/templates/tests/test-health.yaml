apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dsp.fullname" . }}-test-health
  labels: {{- include "dsp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command: ["sh", "-c", "wget -q -T 10 -O- http://{{ include "dsp.fullname" . }}:{{ .Values.service.port }}/health | grep -q ok"]
