{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dsp.fullname" . }}-api
  labels: {{- include "dsp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dsp.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8080
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dsp.fullname" . }}-postgres
  labels: {{- include "dsp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dsp.pgSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "dsp.selector" . | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "dsp.backupSelector" . | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
{{- end }}
