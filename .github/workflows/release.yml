name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          push: true
          tags: |
            ghcr.io/splitwave-technologies/control-plane:${{ env.VERSION }}
            ghcr.io/splitwave-technologies/control-plane:latest
      - name: Bundle
        run: scripts/make-release.sh "$VERSION" dist
      - name: Publish
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/splitwave-"$VERSION".tar.gz dist/SHA256SUMS \
            --title "SplitWave $VERSION" --generate-notes $([[ "$VERSION" == *-* ]] && echo --prerelease)
